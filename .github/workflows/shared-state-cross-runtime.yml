name: Shared State cross-runtime recovery

on:
  pull_request:
    paths:
      - ".github/workflows/shared-state-cross-runtime.yml"
      - "par/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Execute real read-only task and export portable state
        shell: bash
        run: |
          set -euo pipefail
          DB="$RUNNER_TEMP/producer/runtime.db"
          mkdir -p "$(dirname "$DB")" evidence
          python -m par --db "$DB" init >/dev/null

          REPO_COMMIT=$(git rev-parse HEAD)
          AGENTS_SHA=$(sha256sum AGENTS.md | awk '{print $1}')

          CREATE_JSON=$(python -m par --db "$DB" task create \
            --goal "Inspect the checked-out repository commit and AGENTS.md SHA-256, then persist objective read-only evidence." \
            --repo koshuang/personal-agent-runtime \
            --mode read-only \
            --context '{"source_issue":"#1,#16","pilot":"github-actions-cross-runtime-real-task"}')
          TASK_ID=$(printf '%s' "$CREATE_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          CLAIM_JSON=$(python -m par --db "$DB" task claim "$TASK_ID" --worker producer-runner)
          RUN_ID=$(printf '%s' "$CLAIM_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')

          EVIDENCE=$(python -c 'import json,os; print(json.dumps(["git-commit:" + os.environ["REPO_COMMIT"], "AGENTS.md-sha256:" + os.environ["AGENTS_SHA"]]))' \
            REPO_COMMIT="$REPO_COMMIT" AGENTS_SHA="$AGENTS_SHA")
          METADATA=$(python -c 'import json,os; print(json.dumps({"cost_usd":0,"credential_access":False,"target_repo_writes":0,"repository_commit":os.environ["REPO_COMMIT"],"agents_sha256":os.environ["AGENTS_SHA"]}))' \
            REPO_COMMIT="$REPO_COMMIT" AGENTS_SHA="$AGENTS_SHA")

          python -m par --db "$DB" task complete "$TASK_ID" \
            --run-id "$RUN_ID" \
            --worker producer-runner \
            --summary "Read-only repository inspection completed with commit and AGENTS.md hash evidence." \
            --evidence "$EVIDENCE" \
            --blockers '[]' \
            --next-action "Fresh runner must restore this state and independently verify the persisted repository evidence." \
            --metadata "$METADATA"

          python -m par --db "$DB" task show "$TASK_ID" > evidence/expected.json
          printf '%s\n' "$TASK_ID" > evidence/task-id.txt
          python -m par --db "$DB" state export evidence/state.parstate >/dev/null

          test ! -e evidence/runtime.db
          test ! -e evidence/runtime.db-wal
          test ! -e evidence/runtime.db-shm
      - name: Upload portability artifact only
        uses: actions/upload-artifact@v4
        with:
          name: shared-state-portability
          path: |
            evidence/state.parstate
            evidence/task-id.txt
            evidence/expected.json
          if-no-files-found: error
          retention-days: 1

  recover-state:
    needs: produce-state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Download portable state from independent runner
        uses: actions/download-artifact@v5
        with:
          name: shared-state-portability
          path: evidence
      - name: Restore and prove transcript-free recovery
        shell: bash
        run: |
          set -euo pipefail
          TASK_ID=$(cat evidence/task-id.txt)
          DB="$RUNNER_TEMP/fresh-runtime/runtime.db"
          mkdir -p "$(dirname "$DB")"

          test ! -e "$DB"
          python -m par --db "$DB" state restore evidence/state.parstate >/dev/null
          python -m par --db "$DB" task show "$TASK_ID" > evidence/recovered.json

          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          expected = json.loads(Path("evidence/expected.json").read_text())
          recovered = json.loads(Path("evidence/recovered.json").read_text())

          assert recovered["id"] == expected["id"]
          assert recovered["status"] == "completed"
          assert recovered["next_action"] == expected["next_action"]
          assert recovered["repo"] == "koshuang/personal-agent-runtime"

          assert [r["id"] for r in recovered["runs"]] == [r["id"] for r in expected["runs"]]
          assert [e["id"] for e in recovered["events"]] == [e["id"] for e in expected["events"]]
          assert [a["id"] for a in recovered["artifacts"]] == [a["id"] for a in expected["artifacts"]]

          run = recovered["runs"][-1]
          evidence = json.loads(run["evidence_json"])
          metadata = json.loads(run["metadata_json"])
          blockers = json.loads(run["blockers_json"])

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          agents_sha = hashlib.sha256(Path("AGENTS.md").read_bytes()).hexdigest()

          assert run["summary"] == "Read-only repository inspection completed with commit and AGENTS.md hash evidence."
          assert evidence == [f"git-commit:{commit}", f"AGENTS.md-sha256:{agents_sha}"]
          assert blockers == []
          assert metadata["repository_commit"] == commit
          assert metadata["agents_sha256"] == agents_sha
          assert metadata["cost_usd"] == 0
          assert metadata["credential_access"] is False
          assert metadata["target_repo_writes"] == 0
          PY
      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: shared-state-recovery-evidence
          path: evidence/recovered.json
          if-no-files-found: error
          retention-days: 7
