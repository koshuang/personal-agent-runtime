name: Phase 4 runtime event ingress

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  check_run:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  persist-delivery:
    if: github.event_name != 'check_run' || github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Persist immutable GitHub delivery before reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: phase4-delivery-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.event_path }}
          retention-days: 90
