name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - name: Run Go tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test-output.txt
      - name: Upload Go test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-output
          path: go-test-output.txt
